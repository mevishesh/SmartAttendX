<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>My Profile - SmartAttendX</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

  <style>
    /* ===== General Page ===== */
    body {
      margin: 0;
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ecf7 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #333;
    }

    /* ===== Profile Card ===== */
    .profile-card {
      background: #fff;
      width: 420px;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 2.5rem;
      text-align: center;
      transition: all 0.3s ease;
    }
    .profile-card:hover {
      box-shadow: 0 14px 40px rgba(0,0,0,0.1);
    }

    /* ===== Profile Picture ===== */
    .profile-card img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #3b82f6;
      margin-bottom: 1rem;
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .profile-card img:hover {
      transform: scale(1.05);
      border-color: #2563eb;
    }

    /* ===== Profile Info ===== */
    .profile-card h2 {
      font-size: 1.5rem;
      color: #1f2937;
      margin-bottom: 0.3rem;
    }
    .profile-card p {
      font-size: 0.95rem;
      color: #6b7280;
      margin-bottom: 1.8rem;
    }

    /* ===== Buttons ===== */
    .btn {
      display: inline-block;
      padding: 0.6rem 1.2rem;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.25s ease;
      text-decoration: none;
      box-shadow: 0 3px 10px rgba(59,130,246,0.2);
    }
    .btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn.secondary {
      background: #6b7280;
    }
    .btn.secondary:hover {
      background: #4b5563;
    }

    /* ===== Edit Form ===== */
    .edit-form {
      margin-top: 1.8rem;
      text-align: left;
      background: #f9fafc;
      padding: 1.5rem;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      box-shadow: inset 0 0 8px rgba(0,0,0,0.03);
      display: none; /* Hidden initially */
      animation: fadeIn 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-5px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .edit-form label {
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 0.4rem;
      font-size: 0.9rem;
    }
    .edit-form input[type="text"],
    .edit-form input[type="email"],
    .edit-form input[type="file"] {
      width: 100%;
      padding: 0.65rem;
      margin-bottom: 1rem;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.95rem;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .edit-form input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
      outline: none;
    }

    .edit-form button {
      width: 100%;
      background: #16a34a;
      box-shadow: 0 3px 10px rgba(22,163,74,0.2);
    }
    .edit-form button:hover {
      background: #15803d;
    }

    /* ===== Back Button Container ===== */
    .button-row {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      align-items: center;
    }
    
  </style>
</head>
<body>

  <div class="profile-card">
    <!-- Profile Picture -->
    <img src="{{ url_for('static', filename=admin['profile_pic'] if admin['profile_pic'] else 'image.png') }}" 
         alt="Profile Picture">

    <!-- Info -->
    <h2>{{ admin['name'] }}</h2>
    <p>{{ admin['email'] }}</p>

    <!-- Buttons -->
    <div class="button-row">
      <button class="btn" onclick="toggleEdit()">✏ Edit Profile</button>
      <a href="{{ url_for('dashboard') }}" class="btn secondary">⬅ Back to Dashboard</a>
    </div>

    <!-- Edit Form -->
    <form class="edit-form" action="{{ url_for('update_profile') }}" method="POST" enctype="multipart/form-data">
      <label for="name">Full Name</label>
      <input type="text" name="name" value="{{ admin['name'] }}" required>

      <label for="email">Email Address</label>
      <input type="email" name="email" value="{{ admin['email'] }}" required>

      <label for="profile_pic">Profile Picture</label>
      <input type="file" name="profile_pic" accept="image/*">

      <button type="submit" class="btn">💾 Save Changes</button>
    </form>
  </div>

  <script>
    function toggleEdit() {
      const form = document.querySelector('.edit-form');
      const isVisible = form.style.display === 'block';
      form.style.display = isVisible ? 'none' : 'block';
    }
  </script>

</body>
</html>
