<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>2-Step Login - SmartAttendX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://kit.fontawesome.com/4e5dfafbd1.js" crossorigin="anonymous"></script>
</head>

<body class="auth-body">
  <div class="auth-container">
    <div class="auth-info">
      <h1>Secure Login</h1>
      <p>Protect your SmartAttendX account with 2-Step Verification</p>
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="App Logo" class="logo">
    </div>

    <div class="auth-form">
      <h2>Login</h2>

      <!-- Step 1: Firebase Login -->
      <form id="loginForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="login-email" required placeholder="Email" />
        </div>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="login-password" required placeholder="Password" />
        </div>
        <button type="submit" class="btn primary btn-block">Next</button>
      </form>

      <!-- Step 2: OTP Verification -->
      <div id="otpStep" style="display:none; margin-top:1.5rem;">
        <p style="text-align:center;">An OTP has been sent to your email.</p>
        <div class="input-group">
          <i class="fas fa-key"></i>
          <input type="text" id="otp-code" maxlength="6" placeholder="Enter OTP" />
        </div>
        <button id="verifyOtpBtn" class="btn secondary btn-block">Verify & Login</button>
      </div>
    </div>
  </div>

  <!-- ✅ Firebase 2-Step Verification Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    // ✅ Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyA3p7aGRwnoe-czU5l9iOsx-bGZ0c4ONyw",
      authDomain: "smartattendx-2025.firebaseapp.com",
      projectId: "smartattendx-2025",
      storageBucket: "smartattendx-2025.appspot.com",
      messagingSenderId: "169887480453",
      appId: "1:169887480453:web:2e3b00159ca6d001d947ec",
      measurementId: "G-DZJ4E83G4Y"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const otpStep = document.getElementById("otpStep");
    const verifyOtpBtn = document.getElementById("verifyOtpBtn");
    let currentEmail = "";

    // Step 1️⃣ Firebase login (email + password)
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();
      currentEmail = email;

      try {
        const cred = await signInWithEmailAndPassword(auth, email, password);
        console.log("✅ Firebase login success for:", cred.user.email);

        // Ask Flask to send OTP
        const res = await fetch("/send-otp", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email })
        });

        const data = await res.json();
        if (data.success) {
          alert("✅ Password verified. OTP sent to your email.");
          otpStep.style.display = "block";
          loginForm.style.display = "none";
        } else {
          alert("⚠️ Failed to send OTP: " + (data.error || "Unknown error"));
        }
      } catch (err) {
        alert("❌ Login failed: " + err.message);
      }
    });

    // Step 2️⃣ OTP Verification
    verifyOtpBtn.addEventListener("click", async () => {
      const otp = document.getElementById("otp-code").value.trim();
      if (!otp) return alert("Enter OTP first.");
      if (!currentEmail) return alert("Email missing. Please log in again.");

      const res = await fetch("/verify-otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: currentEmail, otp })
      });

      const data = await res.json();
      if (data.success) {
        alert("✅ OTP verified! Logging in...");
        const user = auth.currentUser;
        const idToken = await user.getIdToken(true);

        // Create Firebase session cookie
        const resp = await fetch("/sessionLogin", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ idToken }),
          credentials: "include"
        });

        if (resp.ok) {
          window.location.href = "/dashboard";
        } else {
          alert("❌ Login session creation failed. Please try again.");
        }
      } else {
        alert("❌ " + (data.error || "OTP verification failed"));
      }
    });
  </script>
</body>
</html>
