<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Login - SmartAttendX</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://kit.fontawesome.com/4e5dfafbd1.js" crossorigin="anonymous"></script>
</head>

<body class="auth-body">
  <div class="auth-container">
    <div class="auth-info">
      <h1>Welcome Back</h1>
      <p>Login to access your SmartAttendX dashboard</p>
      <img src="{{ url_for('static', filename='images/logo.png') }}" alt="App Logo" class="logo">
    </div>

    <div class="auth-form">
      <h2>Login</h2>

      <form id="loginForm">
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="login-email" required placeholder="Email" />
        </div>

        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="login-password" required placeholder="Password" />
        </div>

        <button type="submit" class="btn primary btn-block">Login</button>
      </form>
    </div>
  </div>

  <!-- ✅ Simple Login Script (Flask Only, No OTP) -->
  <script>
    const loginForm = document.getElementById("loginForm");

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value.trim();

      try {
        const res = await fetch("/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (data.success) {
          alert("✅ Login successful!");
          window.location.href = "/dashboard";
        } else {
          alert("❌ " + (data.error || "Invalid credentials"));
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("⚠️ Login request failed. Please try again.");
      }
    });
  </script>
</body>
</html>
